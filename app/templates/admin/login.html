{% extends "base.html" %}
{% block title %}Admin Login - Serbia Alerts{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <h1 class="text-2xl font-bold mb-4">Admin Prijava</h1>
    <form method="post" action="/admin/login" class="space-y-4">
        <input type="password" name="password" placeholder="Lozinka"
               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Prijavi se</button>
    </form>
</div>
{% endblock %}
